onboarding = false

[keys]
# Match tmux's Ctrl+b prefix while keeping pane navigation one chord away.
prefix = "ctrl+b"
focus_pane_left = ["prefix+h", "cmd+h"]
focus_pane_down = ["prefix+j", "cmd+j"]
focus_pane_up = ["prefix+k", "cmd+k"]
focus_pane_right = ["prefix+l", "cmd+l"]
zoom = "prefix+f"

[ui]
# Lotus is a warm scheme; the default blue accent fights it.
accent = "peach"
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true


# colorstack:BEGIN herdr
# generated by colorstack -- edit the palette, not this file
# Modus Operandi Tinted

[theme]
# A fixed substrate, deliberately NOT tied to the palette: herdr needs
# a name it recognises, and every token that matters is overridden
# below. Its only job is to catch tokens [theme.custom] does not name.
name = "kanagawa-lotus"
auto_switch = false

[theme.custom]
panel_bg = "#fbf7f0"
surface0 = "#e6e3dc"
surface1 = "#d6d3cd"
surface_dim = "#efebe4"
overlay0 = "#928f8d"
overlay1 = "#73726f"
text = "#3f3e3e"
subtext0 = "#75716c"
accent = "#6f5500"
red = "#a60000"
green = "#006800"
yellow = "#6f5500"
blue = "#0031a9"
mauve = "#721045"
teal = "#005e8b"
peach = "#6f5500"
# colorstack:END herdr

# rarebit-status:BEGIN
# Exact-Session Rarebit state plus the Summary/timeline deck shortcut.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "workspace", bold = false, dim = true }, { token = "tab", bold = true, dim = false }, { token = "$rarebit_attention", fg = "#946f01", bold = true }, { token = "$rarebit_error", fg = "#af3029", bold = true }],
  [{ token = "$rarebit_state_neutral", fg = "#424140" }, { token = "$rarebit_state_attention", fg = "#946f01", bold = true }, { token = "$rarebit_state_muted", fg = "#75756f", dim = true }, { token = "$rarebit_state_diagnostic", fg = "#af3029", bold = true }, { token = "$rarebit_state", fg = "#6f5500" }],
  [{ token = "$rarebit_user_age", fg = "#75756f", dim = true }, { token = "$rarebit_stop_age", fg = "#75756f", dim = true }],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "rarebit-status.open"
description = "open Rarebit Status deck (Summary + timeline)"
# rarebit-status:END

# agent-view-presets:BEGIN
# Agent filtering is orthogonal to the grouped/priority sort toggle.
[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "agent-view-presets.toggle-teammates"
description = "toggle active PiTeams teammates"
# agent-view-presets:END
