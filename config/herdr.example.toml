# Complete behavior/keybinding example. Merge the blocks you need into an
# existing config instead of replacing machine-specific preferences.
onboarding = false

[keys]
# Match tmux's Ctrl+b prefix while keeping pane navigation one chord away.
prefix = "ctrl+b"
focus_pane_left = ["prefix+h", "cmd+h"]
focus_pane_down = ["prefix+j", "cmd+j"]
focus_pane_up = ["prefix+k", "cmd+k"]
focus_pane_right = ["prefix+l", "cmd+l"]
# Ghostty passes Cmd+F through to this binding.
zoom = "cmd+f"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

# Exact-Session Rarebit state plus the Summary/timeline deck shortcut.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "tab", bold = true, dim = false }, { token = "workspace", bold = false, dim = true }, { token = "$rarebit_attention", bold = true }, { token = "$rarebit_error", bold = true }],
  [{ token = "$rarebit_state_neutral" }, { token = "$rarebit_state_attention", bold = true }, { token = "$rarebit_state_muted", dim = true }, { token = "$rarebit_state_diagnostic", bold = true }, { token = "$rarebit_state" }],
  [{ token = "$rarebit_user_age", dim = true }, { token = "$rarebit_stop_age", dim = true }],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "rarebit-status.open"
description = "open Rarebit Status deck (Summary + timeline)"

# Agent filtering is orthogonal to the grouped/priority sort toggle.
[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "agent-view-presets.toggle-teammates"
description = "toggle active PiTeams teammates"

# The file-viewer plugin is separately pinned in herdr.plugins.lock.toml.
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "open file viewer beside the current work"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
description = "open file viewer in its own tab"
