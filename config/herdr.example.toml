# Minimal Herdr preferences for Rarebit's optional Session-activity clocks.
# Copy the relevant settings into ~/.config/herdr/config.toml and adapt.
onboarding = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  [
    { token = "$rarebit_user_age", dim = true },
    { token = "$rarebit_stop_age", dim = true },
  ],
]
