<script>
// IDE-owned data. The hub injects optional palettes before body paint.
// Built-in fallback palette. This is the only concrete colour block in this renderer.
const fallbackPalette = {
  key:'modus-dark', name:'Modus Vivendi Tinted', scheme:'dark',
  colors:{bg:'#0d0e1c','bg-soft':'#1d2235','bg-alt':'#2a3045','bg-hi':'#3a3f5a',fg:'#bcbbbb',dim:'#575f76',
    red:'#ff5f59',green:'#44bc44',yellow:'#d0bc00',blue:'#2fafff',magenta:'#feacd0',cyan:'#00d3d0'},
  mix:{dim:'47%',red:'100%',green:'100%',yellow:'100%',blue:'100%',magenta:'100%',cyan:'100%'}
};
let themeData = {schemaVersion:1,palettes:[fallbackPalette]};
function preference(key, value) {
  try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch {}
}
function applyTheme(key) {
  const palette = themeData?.palettes.find((p) => p.key === key);
  if (!palette) return;
  const root = document.documentElement;
  for (const [role, value] of Object.entries(palette.colors)) root.style.setProperty(`--cs-${role}`, value);
  for (const [role, value] of Object.entries(palette.mix)) root.style.setProperty(`--mix-${role}`, value);
  root.style.colorScheme = palette.scheme;
  root.dataset.theme = key;
}
try {
  const data = JSON.parse(document.getElementById('theme-data').textContent);
  const roles = ['bg','bg-soft','bg-alt','bg-hi','fg','dim','red','green','yellow','blue','magenta','cyan'];
  const inks = ['dim','red','green','yellow','blue','magenta','cyan'];
  if (data?.schemaVersion === 1 && data.palettes?.length && data.palettes.every((p) =>
      typeof p.key === 'string' && typeof p.name === 'string' && ['dark','light'].includes(p.scheme) &&
      roles.every((r) => /^#[\da-f]{6}$/i.test(p.colors?.[r])) &&
      inks.every((r) => /^(?:100|[1-9]?\d)%$/.test(p.mix?.[r]))) &&
      data.palettes.some((p) => p.key === 'modus-dark')) themeData = data;
} catch {}
const savedTheme = preference('sessionMirror.theme.v1');
applyTheme(themeData.palettes.some((p) => p.key === savedTheme) ? savedTheme : 'modus-dark');
</script>

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

// The hub flags a copy that stays behind the remote file; never let a stale view look current.
const stale = (a) => a?.behindBytes ? ` · <b style="color:var(--err)">copy stalled, ${(a.behindBytes / 1e6).toFixed(1)} MB behind</b>` : '';

const agentOf = (p) => agents.find((a) => agentKey(a) === p);
const api = (u, body) => fetch(u, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : undefined).then((r) => r.json()).catch((e) => ({ ok: false, error: e.message }));

// ---------- sidebar ----------
// Host-qualified presentation preferences never edit the Herdr registry.
function readList(name) { try { const v = JSON.parse(preference(`sessionMirror.${name}.v1`) || '[]'); return new Set(Array.isArray(v) ? v.filter((x) => typeof x === 'string') : []); } catch { return new Set(); } }

$('#leads-only').checked = leadsOnly;

function toggleSet(set, value, name) { set.has(value) ? set.delete(value) : set.add(value); preference(`sessionMirror.${name}.v1`, JSON.stringify([...set])); renderSide(); }
const searchable = (a) => `${hostLabel(a.host)} ${niceTitle(a)} ${a.cwd} ${a.name} ${teamOfA(a)}`.toLowerCase();

function renderSide() {
  const q = $('#filter').value.toLowerCase();

  const subOf = (a) => `${a.mirrored} entries${stale(a)}${a.tokens?.rarebit_state_attention ? ' · ' + esc(a.tokens.rarebit_state_attention) : ''}`;
  const row = (a) => `<div class="th ${agentKey(a) === sel ? 'sel' : ''}" data-p="${esc(agentKey(a))}">${dot(a)}
      <span class="nm">${esc(niceTitle(a))}</span><span class="ag">${ago(a.updatedAt)}</span>
      <span class="sub">${multi() ? esc(hostLabel(a.host)) + ' · ' : ''}${a.team ? esc(teamOfA(a)) : esc(a.tabLabel ?? '')} · ${subOf(a)}</span></div>`;
  // In a cluster the row name is the member; the sub line names the pane title, which is not the member's Task.
  const memberRow = (a, summary = '') => `<div class="th ${a.team.role === 'lead' ? 'ld' : 'wk'} ${agentKey(a) === sel ? 'sel' : ''}" data-p="${esc(agentKey(a))}">${dot(a)}
      <span class="nm">${a.team.role === 'lead' ? esc(a.team.member) + '<span class="role">lead</span>' : '↳ ' + esc(a.team.member)}</span><span class="ag">${ago(a.updatedAt)}</span>

  const needs = agents.filter(attn);
  let h = `<button id="needs-toggle" class="sec" aria-expanded="${!needsClosed}"><span>${needsClosed ? '▸' : '▾'} Needs you</span><span>${needs.length}</span></button>`;
  if (!needsClosed || q) h += list.filter(attn).map(row).join('');
  for (const host of hosts) {
    const all = agents.filter((a) => a.host === host.id), visible = list.filter((a) => a.host === host.id);
    if (q ? !visible.length : hiddenHosts.has(host.id)) continue;
    if (multi()) h += `<section class="host-head" data-host="${esc(host.id)}"><button data-host-toggle="${esc(host.id)}" aria-expanded="${!closedHosts.has(host.id)}">${closedHosts.has(host.id) && !q ? '▸' : '▾'} ${esc(host.label)}</button><span class="counts">${counts(all)}</span><span class="host-state">${esc(host.link.state)}${host.link.state === 'live' ? ` · ${host.link.lastLagMs ?? '?'}ms` : ' · cached view; writes paused'}</span>${host.link.state !== 'live' && host.link.reconnectHint ? `<span class="host-state">${esc(host.link.reconnectHint)}</span>` : ''}</section>`;

// ---------- thread rendering ----------
// Each loaded page renders into its own .chunk element with its own renderer state.
// Tool results find their call across pages through `tools` and `orphans`.
// Heavy bodies (tool output, thinking, diffs) render on first open: `lazy` maps a <details> to its body.
let tools = new Map(), orphans = new Map(), entryEls = new Map(), lazy = new WeakMap(), tail = null;
function newChunk(where) {

  return { T: el, work: null };
}
function closeWork(R) { if (R.work) { R.work.el.classList.remove('active'); R.work = null; } }
function workBlock(R) {
  if (R.work) return R.work;
  const el = document.createElement('details');
  el.className = 'work'; if (allOpen) el.open = true;
  el.innerHTML = `<summary><span class="spin"></span><span class="sum"></span></summary><div class="items"></div>`;
  R.T.appendChild(el);
  R.work = { el, items: el.querySelector('.items'), n: 0, names: {}, t0: null, t1: null };
  return R.work;
}
function updateWorkSummary(w) {
  const names = Object.entries(w.names).sort((a, b) => b[1] - a[1]).map(([k, v]) => v > 1 ? `${k}×${v}` : k).join(', ');
  const dur = w.t0 && w.t1 ? Math.round((w.t1 - w.t0) / 1000) : 0;
  w.el.querySelector('.sum').textContent = `${w.n ? `${w.n} tool call${w.n > 1 ? 's' : ''}` : 'Thinking'}${dur ? ` · ${dur >= 60 ? `${dur / 60 | 0}m ${dur % 60}s` : `${dur}s`}` : ''}${names ? ` — ${names}` : ''}`;
}
const toolHint = (a) => { a = a || {}; return a.command ?? a.path ?? a.file_path ?? a.pattern ?? a.query ?? a.url ?? a.task_id ?? a.text ?? JSON.stringify(a); };
function argsView(name, a) {
  if (name === 'edit' && Array.isArray(a?.edits)) {
    return `<pre class="diff">${esc(a.path)}\n${a.edits.map((e) => (e.oldText || '').split('\n').map((l) => `<span class="del">- ${esc(l)}</span>`).join('') +
      (e.newText || '').split('\n').map((l) => `<span class="add">+ ${esc(l)}</span>`).join('')).join('\n')}</pre>`;
  }
  if (name === 'bash') return `<pre>$ ${esc(a?.command)}</pre>`;
  if (name === 'write') return `<pre>${esc(a?.path)}\n\n${esc(String(a?.content ?? '').slice(0, 8000))}</pre>`;

function stamp(w, ts) { const t = Date.parse(ts); if (!t) return; w.t0 ??= t; w.t1 = t; }

  el.innerHTML = `<summary>${summary}</summary>`;

  return el;
}
function fill(el) { const b = lazy.get(el); if (b) { lazy.delete(el); el.insertAdjacentHTML('beforeend', b()); } }
document.addEventListener('toggle', (e) => { if (e.target.open) fill(e.target); }, true);
function attachResult(t, m) {

  if (m.isError) t.el.classList.add('err');
  t.el.querySelector('.r').textContent = `${m.isError ? '✗' : '✓'} ${out.split('\n').length} lines`;
  const prev = lazy.get(t.el) ?? (() => '');
  lazy.set(t.el, () => prev() + `<pre>${esc(out.slice(0, 30000))}</pre>`);

function renderEntry(R, e, i) {
  const els = [];
  const add = (html) => { R.T.insertAdjacentHTML('beforeend', html); els.push(R.T.lastElementChild); };
  if (e.type === 'message') {
    const m = e.message;
    if (m.role === 'user') {
      closeWork(R);
      const text = textOf(m.content);
      // Replace a matching optimistic bubble instead of showing the message twice.
      const k = pendingSends.findIndex((p) => p.text.trim() === text.trim());
      if (k >= 0) { pendingSends[k].el.remove(); pendingSends.splice(k, 1); }
      add(`<div class="u" data-i="${i}"><div>${esc(text)}</div></div>`);
    } else if (m.role === 'assistant') {
      if (m.model) model = m.model;
      for (const p of m.content || []) {
        if (p.type === 'text' && p.text?.trim()) {
          closeWork(R); // text after tool calls ends the work log ("worked for…" shape)
          add(`<div class="a">${md(p.text)}</div>`);
        } else if (p.type === 'thinking' && p.thinking?.trim()) {
          const w = workBlock(R); stamp(w, e.timestamp);
          const el = fold('think', `thought · ${esc(short(p.thinking, 90))}`, () => `<pre>${esc(p.thinking)}</pre>`);
          w.items.appendChild(el); els.push(el);
          updateWorkSummary(w);
        } else if (p.type === 'toolCall') {
          const w = workBlock(R); stamp(w, e.timestamp);
          w.n++; w.names[p.name] = (w.names[p.name] || 0) + 1;
          const el = fold('tool wait', `${esc(p.name)} <span style="color:var(--fg)">${esc(short(toolHint(p.arguments)))}</span> <span class="r"></span>`, () => argsView(p.name, p.arguments));
          w.items.appendChild(el); els.push(el);
          const t = { el, w };
          tools.set(p.id, t);
          if (orphans.has(p.id)) { attachResult(t, orphans.get(p.id).m); entryEls.set(orphans.get(p.id).i, [el]); orphans.delete(p.id); }
          updateWorkSummary(w);
          if (agentOf(sel)?.status === 'working' && R === tail) w.el.classList.add('active');
        }
      }
      if (m.stopReason === 'aborted' || /operation was aborted/i.test(m.errorMessage || '')) add(`<div class="meta" style="color:var(--warn)">⏹ interrupted</div>`);
      else if (m.stopReason === 'error' || m.errorMessage) add(`<div class="meta" style="color:var(--err)">⚠ ${esc(m.errorMessage || 'error')}</div>`);
    } else if (m.role === 'toolResult') {
      const t = tools.get(m.toolCallId);
      if (t) { attachResult(t, m); stamp(t.w, e.timestamp); updateWorkSummary(t.w); els.push(t.el); }
      else orphans.set(m.toolCallId, { m, i }); // its call is on an older page
    } else if (m.role === 'bashExecution') {
      closeWork(R);
      const el = fold('tool', `! ${esc(m.command)}`, () => `<pre>${esc(m.output)}</pre>`);
      R.T.appendChild(el); els.push(el);
    }
  } else if (e.type === 'custom_message' && e.display !== false) {
    const w = workBlock(R);
    const el = fold('think', `${esc(e.customType)} · ${esc(short(textOf(e.content), 80))}`, () => `<pre>${esc(textOf(e.content).slice(0, 20000))}</pre>`);
    w.items.appendChild(el); els.push(el);
  } else if (e.type === 'compaction') {
    closeWork(R);
    add(`<div class="meta compact">Context compacted</div>`);
    const el = fold('think', 'summary', () => `<pre>${esc(e.summary)}</pre>`);
    R.T.appendChild(el); els.push(el);
  } else if (e.type === 'model_change') add(`<div class="meta">model → ${esc(e.modelId)}</div>`);

}
function renderPage(R, entries, from) { entries.forEach((e, k) => renderEntry(R, e, from + k)); }
function edgeNote() {
  $('#topEdge')?.remove();
  const note = win.from > 0 ? `${win.from} earlier entries · scroll up to load` : agentOf(sel) && win.total ? 'Start of Session' : '';
  if (note) $('#thread').insertAdjacentHTML('afterbegin', `<div class="edge" id="topEdge">${note}</div>`);
}

// ---------- open / page / follow ----------
async function open(p, around) {
  sel = p; preference('sessionMirror.selection.v1', p); follow = around == null; tail = null; opening = true;
  F.ctl?.abort(); F.hits = []; pendingSends.length = 0;
  const a = agentOf(p);
  renderSide(); renderHead();
  await fetch(`/watch?token=${token}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ panes: a?.pane ? [{ host: a.host, pane: a.pane }] : [], sessions: [{ host: selectedRef(p).host, path: selectedRef(p).session }] }) });
  const q = around == null ? '' : `&from=${Math.max(0, around - PAGE / 2)}&to=${around + PAGE / 2}`;
  const r = await api('/session?' + sessionQuery(p) + q);
  if (sel !== p) return;
  opening = false;
  if (!r.entries) return toast(r.error || 'Session unavailable');
  tools = new Map(); orphans = new Map(); entryEls = new Map(); model = '';
  $('#thread').innerHTML = '';
  win = { from: r.from, to: r.to, total: r.total, prompt: r.prompt };
  tail = newChunk('bottom');
  renderPage(tail, r.entries, r.from);
  if (a?.status !== 'working') closeWork(tail);
  edgeNote(); renderHead(); renderPanel();
  if (around == null) $('#scroll').scrollTop = $('#scroll').scrollHeight;
  $('#jump').style.display = win.to < win.total ? 'block' : 'none';
  updatePin();
  updateSend();
  if (around == null && !input.disabled) input.focus();
}
async function loadOlder() {
  if (loading || win.from <= 0) return;
  loading = true;
  const p = sel, to = win.from, from = Math.max(0, to - PAGE);
  const r = await api(`/session?${sessionQuery(p)}&from=${from}&to=${to}`);
  if (sel === p) {
    const s = $('#scroll'), h0 = s.scrollHeight;
    $('#topEdge')?.remove();
    const R = newChunk('top');
    renderPage(R, r.entries, from);
    closeWork(R);
    win.from = from; win.prompt = r.prompt;
    edgeNote();
    s.scrollTop += s.scrollHeight - h0; // keep the reader's place
  }
  loading = false;
}
async function loadNewer() {
  if (loading || win.to >= win.total) return;
  loading = true;
  const p = sel, from = win.to;
  const r = await api(`/session?${sessionQuery(p)}&from=${from}&to=${from + PAGE}`);
  if (sel === p) {
    renderPage(tail, r.entries, from);
    win.to = r.to; win.total = Math.max(win.total, r.total);
    $('#jump').style.display = win.to < win.total ? 'block' : 'none';
  }
  loading = false;
}
function toLatest() {
  if (win.to < win.total - PAGE) return open(sel); // far away: reload the last page
  loadNewer().then(() => { $('#scroll').scrollTop = $('#scroll').scrollHeight; follow = true; $('#jump').style.display = 'none'; });
}
$('#scroll').addEventListener('scroll', () => {
  const s = $('#scroll');
  const nearBottom = s.scrollHeight - s.scrollTop - s.clientHeight < 60;
  follow = nearBottom && win.to >= win.total;
  if (follow) $('#jump').style.display = 'none';
  if (s.scrollTop < 600) loadOlder();
  if (nearBottom && win.to < win.total) loadNewer();
  updatePin();
});
$('#jump').onclick = toLatest;

// ---------- pinned prompt: the user message the entries at the top of the view answer ----------
// A loaded prompt pins once its bubble scrolls above the view. With no loaded prompt above the view,
// the hub's `prompt` (the newest one before the loaded window) pins. A prompt on screen does not pin.
let pinQueued = false, pinned = null;
function updatePin() {
  if (pinQueued) return;
  pinQueued = true;
  requestAnimationFrame(() => {
    pinQueued = false;
    const top = $('#scroll').getBoundingClientRect().top;
    const us = document.querySelectorAll('#thread .u[data-i]');
    let held = null;
    for (const u of us) {
      if (u.getBoundingClientRect().bottom > top + 4) break;
      held = u;
    }
    // A prompt in the top band is already on screen, and the pin would cover it.
    const band = [...us].some((u) => { const r = u.getBoundingClientRect(); return r.bottom > top + 4 && r.top < top + 80; });
    // Without a loaded prompt above, the top entries answer the hub's prompt.
    pinned = band ? null : held ? { i: Number(held.dataset.i), text: held.textContent }
      : win.from > 0 && win.prompt ? win.prompt : null;
    const box = $('#pin');
    box.style.display = pinned ? 'block' : 'none';
    if (pinned) {
      box.firstElementChild.innerHTML = `<b>↑ #${pinned.i}</b>${esc(pinned.text)}`;
      box.firstElementChild.title = 'Show this message';
    }
  });
}
$('#pin').addEventListener('click', async () => {
  if (!pinned) return;
  const i = pinned.i;
  // Load the prompt near the top of the window, so the turns it started fill the view below it.
  if (i < win.from || i >= win.to) await open(sel, i + PAGE / 2 - 20);
  const el = document.querySelector(`#thread .u[data-i="${i}"]`);
  if (!el) return toast(`entry #${i} is not loaded`);
  follow = false;
  el.scrollIntoView({ block: 'start' });
  $('#scroll').scrollTop -= 12;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1300);
});
new ResizeObserver(updatePin).observe($('#scroll'));

function renderHead() {
  const a = agentOf(sel);
  if (!a) return;
  $('#head').innerHTML = `<div style="min-width:0"><div class="t">${multi() ? esc(hostLabel(a.host)) + ' · ' : ''}${esc(niceTitle(a))}</div><div class="m">${a.team ? `${esc(teamOfA(a))} (${a.team.role === 'lead' ? 'lead' : 'worker'}) · ` : ''}${esc(a.cwd)} · ${esc(model)} · ${esc(a.pane)} · ${win.total} entries${stale(a)}</div></div>
    <span class="sp"></span><span class="pill ${esc(a.status)}">${esc(a.status)}</span>
    <button class="iconbtn" id="tgFind" title="Search this Session (⌘F)">Search</button>
    <button class="iconbtn" id="tgAll" title="Expand all work logs">${allOpen ? 'Collapse' : 'Expand'} work</button>
    <button class="iconbtn" id="tgPanel" title="Remote screen and Session facts">Panel</button>`;
  $('#tgFind').onclick = findOpen;
  $('#tgPanel').onclick = () => setPanel(!document.body.classList.contains('panel'));
  $('#tgAll').onclick = () => { allOpen = !allOpen; document.querySelectorAll('details.work').forEach((d) => (d.open = allOpen)); renderHead(); };
}
function setPanel(on) { document.body.classList.toggle('panel', on); preference('idePanel', on ? '1' : ''); }
function renderPanel() {
  const a = agentOf(sel);
  if (!a) return;
  const scr = live.get(key(a.host, a.pane));
  $('#screen').textContent = scr ? scr.replace(/\s+$/, '') : `Agent is ${a.status}. The remote screen streams here while it works, after a /command, or with “Show 30s”.`;
  $('#facts').innerHTML = [['status', a.status], ['pane', a.pane], ['tab', a.tabLabel ?? a.tab], ['model', model], ['entries', `${win.total} (showing ${win.from}–${win.to})`],
    ['rarebit', a.tokens?.rarebit_state_attention || a.tokens?.rarebit_state_neutral || a.tokens?.rarebit_state_muted || '—'],
    ['host', hostLabel(a.host)], ['session', a.session], ['link', `${linkOf(a)?.state} · lag ${linkOf(a)?.lastLagMs ?? '?'}ms`]]
    .map(([k, v]) => `<b>${esc(k)}</b><span>${esc(v ?? '')}</span>`).join('');
}
$('#peek').onclick = async () => { const r = await api('/screen', { ...selectedRef(), ms: 30000 }); toast(r.ok ? `Streaming remote screen for 30s · ${r.rttMs}ms` : `✗ ${r.error}`); };

// ---------- in-Session search (hub-side index; jumps re-center the window) ----------
let F = { q: '', hits: [], cur: -1, ctl: null };
function findOpen() { $('#find').classList.add('on'); $('#fq').focus(); $('#fq').select(); }
function findClose() { $('#find').classList.remove('on'); CSS.highlights?.clear(); $('#input').focus(); }
$('#fclose').onclick = findClose;
$('#fq').addEventListener('input', async () => {
  const q = $('#fq').value;
  F.ctl?.abort(); F.ctl = new AbortController();
  if (!q) { F = { ...F, q, hits: [], cur: -1 }; $('#fhits').innerHTML = ''; $('#fcnt').textContent = ''; CSS.highlights?.clear(); return; }
  const t0 = performance.now(), selected = sel;
  let r;
  try { r = await fetch(`/search?${sessionQuery()}&q=${encodeURIComponent(q)}&limit=500`, { signal: F.ctl.signal }).then((r) => r.json()); } catch { return; }
  if (sel !== selected || !r.hits) return;
  // Newest first: the reader usually looks for something recent.
  F = { ...F, q, hits: r.hits.reverse(), cur: -1, total: r.total };
  $('#fcnt').textContent = r.total ? `${r.total} entries · ${r.matches} hits · ${Math.round(performance.now() - t0)}ms` : `no match · ${Math.round(performance.now() - t0)}ms`;
  const needle = q.toLowerCase();
  const mark = (s) => { const k = s.toLowerCase().indexOf(needle); return k < 0 ? esc(s) : esc(s.slice(0, k)) + `<mark>${esc(s.slice(k, k + q.length))}</mark>` + esc(s.slice(k + q.length)); };
  $('#fhits').innerHTML = F.hits.slice(0, 200).map((h, k) => `<div class="hit" data-k="${k}"><b>#${h.i}</b><span>${mark(h.snippet)}</span></div>`).join('');
});
$('#fq').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); if (F.hits.length) gotoHit((F.cur + (e.shiftKey ? -1 : 1) + F.hits.length) % F.hits.length); }
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); findClose(); }
});
$('#fhits').addEventListener('click', (e) => { const el = e.target.closest('.hit'); if (el) gotoHit(Number(el.dataset.k)); });
async function gotoHit(k) {
  F.cur = k;
  document.querySelectorAll('#fhits .hit').forEach((el) => el.classList.toggle('on', Number(el.dataset.k) === k));
  document.querySelector(`#fhits .hit[data-k="${k}"]`)?.scrollIntoView({ block: 'nearest' });
  const i = F.hits[k].i;
  if (i < win.from || i >= win.to) await open(sel, i);
  reveal(i, F.q);
}
// Opens the folds that hold entry i, highlights the query, and scrolls the first match into view.
function reveal(i, q) {
  const els = entryEls.get(i) || [];
  const needle = q.toLowerCase();
  const ranges = [];
  for (const el of els) {
    for (let d = el.closest('details') ?? el; d; d = d.parentElement?.closest('details')) { fill(d); d.open = true; }
    if (el.tagName === 'DETAILS') { fill(el); el.open = true; }
    const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    for (let n; (n = walk.nextNode()) && ranges.length < 300;) {
      const s = n.data.toLowerCase();
      for (let at = s.indexOf(needle); at >= 0 && ranges.length < 300; at = s.indexOf(needle, at + needle.length)) {
        const r = new Range(); r.setStart(n, at); r.setEnd(n, at + needle.length); ranges.push(r);
      }
    }
  }
  if (CSS.highlights) {
    CSS.highlights.set('hit', new Highlight(...ranges.slice(1)));
    CSS.highlights.set('hitcur', new Highlight(...ranges.slice(0, 1)));
  }
  follow = false;
  const target = ranges[0]?.startContainer.parentElement ?? els[0];
  if (!target) return toast(`entry #${i} has no visible text`);
  target.scrollIntoView({ block: 'center' });
  // Scroll the inner <pre> too when the match sits deep inside a long tool output.
  const pre = target.closest('pre');
  if (pre && ranges[0]) { const rr = ranges[0].getBoundingClientRect(), pr = pre.getBoundingClientRect(); pre.scrollTop += rr.top - pr.top - pr.height / 2; }
  (els[0].closest('.u,.a,details.work') ?? els[0]).classList.add('flash');
  setTimeout(() => document.querySelectorAll('.flash').forEach((x) => x.classList.remove('flash')), 1300);
}

// ---------- composer: messages, /commands, interrupt ----------
const input = $('#input');
function updateSend() {
  const a = agentOf(sel);
  const stop = a?.status === 'working' && !input.value.trim();
  const b = $('#send');
  const liveHost = linkOf(a)?.state === 'live';
  b.disabled = input.disabled = !a?.pane || !liveHost;
  input.placeholder = !a ? 'Select a Session to send a message' : !liveHost
    ? `${hostLabel(a.host)} reconnecting; writes paused` : !a.pane ? 'This Session has no live pane'
    : `Message ${niceTitle(a)}${multi() ? ' on ' + hostLabel(a.host) : ''} · /command`;
  b.classList.toggle('stop', stop); b.textContent = stop ? '■ Stop' : 'Send';
  input.classList.toggle('cmd', input.value.startsWith('/'));
}
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(220, input.scrollHeight) + 'px'; updateSend(); });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$('#send').onclick = () => ($('#send').classList.contains('stop') ? interrupt() : send());
async function interrupt() {
  const a = agentOf(sel);
  if (!a?.pane) return;
  if (a.status !== 'working') return toast(`Agent is ${a.status}; nothing to interrupt`);
  toast('Interrupting…');
  const r = await api('/interrupt', selectedRef());
  toast(r.ok ? `Interrupt delivered · ${r.rttMs}ms` : `✗ ${r.error}`);
}
async function send() {
  const text = input.value;
  const a = agentOf(sel), selected = sel;
  if (!text.trim() || !a?.pane || input.disabled || !tail) return;
  input.value = ''; input.style.height = 'auto'; updateSend();
  const isCmd = text.trim().startsWith('/');
  const el = document.createElement('div');
  if (isCmd) {
    // Command output goes to the remote screen, not the Session file.
    el.className = 'meta cmd';
    el.textContent = `${text.trim()} · sending…`;
    setPanel(true);
  } else {
    el.className = 'u pending';
    el.innerHTML = `<div>${esc(text)}<span class="st">sending…</span></div>`;
    pendingSends.push({ text, el, session: sel });
  }
  tail.T.appendChild(el);
  if (win.to >= win.total) $('#scroll').scrollTop = $('#scroll').scrollHeight;
  const r = await api('/prompt', { ...selectedRef(), text });
  if (isCmd) el.textContent = r.ok ? `${text.trim()} · ran on remote · ${r.rttMs}ms · output in Remote screen →` : `${text.trim()} · ✗ ${r.error}`;
  else { const st = el.querySelector('.st'); if (st) st.textContent = r.ok ? `delivered · ${r.rttMs}ms · waiting for Pi` : `✗ ${r.error}`; }
  if (sel === selected) $('#sendState').textContent = r.ok ? `last send ${r.rttMs}ms` : '';
}

// ---------- quick switcher ----------
let swIdx = 0;
function swRender() {
  const q = $('#swq').value.toLowerCase();
  const l = agents.filter((a) => `${hostLabel(a.host)} ${niceTitle(a)} ${a.cwd} ${teamOfA(a)}`.toLowerCase().includes(q)).sort((x, y) => y.updatedAt - x.updatedAt).slice(0, 40);
  swIdx = Math.min(swIdx, Math.max(0, l.length - 1));
  $('#swl').innerHTML = l.map((a, i) => `<div class="it ${i === swIdx ? 'on' : ''}" data-p="${esc(agentKey(a))}"><span class="dot ${a.status === 'working' ? 'working' : attn(a) ? 'attn' : ''}"></span><span>${esc(niceTitle(a))}</span><span>${esc(hostLabel(a.host))} · ${a.team ? esc(teamOfA(a)) + ' · ' : ''}${esc(a.cwd?.split('/').pop())} · ${ago(a.updatedAt)}</span></div>`).join('');
  return l;
}
function swOpen() { $('#switcher').classList.add('on'); $('#swq').value = ''; swIdx = 0; swRender(); $('#swq').focus(); }
function swClose() { $('#switcher').classList.remove('on'); input.focus(); }
$('#swq').addEventListener('input', () => { swIdx = 0; swRender(); });
$('#swq').addEventListener('keydown', (e) => {
  const l = swRender();
  if (e.key === 'ArrowDown') { swIdx = Math.min(l.length - 1, swIdx + 1); swRender(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { swIdx = Math.max(0, swIdx - 1); swRender(); e.preventDefault(); }
  if (e.key === 'Enter' && l[swIdx]) { swClose(); open(agentKey(l[swIdx])); }
  if (e.key === 'Escape') { e.stopPropagation(); swClose(); }
});
$('#swl').addEventListener('click', (e) => { const el = e.target.closest('.it'); if (el) { swClose(); open(el.dataset.p); } });
$('#switcher').addEventListener('click', (e) => { if (e.target.id === 'switcher') swClose(); });
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); swOpen(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'f' && sel) { e.preventDefault(); findOpen(); }
  // Esc interrupts, like in Pi. Overlays (search, switcher) consume their own Esc first.
  if (e.key === 'Escape' && !e.defaultPrevented && !$('#switcher').classList.contains('on') && !$('#find').classList.contains('on')) interrupt();
  if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const rows = [...document.querySelectorAll('.th')].map((x) => x.dataset.p);
    const n = rows[rows.indexOf(sel) + (e.key === 'ArrowDown' ? 1 : -1)];
    if (n) open(n);
  }
});

// ---------- hub events ----------
const es = new EventSource(`/events?token=${token}`);
es.addEventListener('hosts', (ev) => {
  const d = JSON.parse(ev.data); hosts = d.hosts;
  $('#registry-note').innerHTML = `${d.registryWarning ? esc(d.registryWarning) + '<br>' : ''}Hosts from Herdr at ${esc(d.registryAt)}; restart the hub to apply changes. <a href="https://herdr.dev" target="_blank" rel="noreferrer">Configure with Herdr machine</a>`;
  renderSide(); renderTeamLine(); updateSend();
});
es.addEventListener('agents', (ev) => {
  const prev = agentOf(sel), prevStatus = prev?.status, prevBehind = prev?.behindBytes;
  const d = JSON.parse(ev.data), list = Array.isArray(d) ? d : d.agents;
  const host = Array.isArray(d) ? hosts[0]?.id : d.host;
  agents = [...agents.filter((a) => a.host !== host), ...list];
  renderSide(); renderTeamLine();
  if (sel && !tail && !opening && agentOf(sel)) open(sel);
  const a = agentOf(sel);
  if (a && a.behindBytes !== prevBehind) renderHead();
  if (a && a.status !== prevStatus) {
    renderHead(); renderPanel(); updateSend();
    if (tail) { if (a.status !== 'working') closeWork(tail); else tail.work?.el.classList.add('active'); }
  }
});
es.addEventListener('append', (ev) => {
  const d = JSON.parse(ev.data);
  const selected = key(d.host, d.path), a = agentOf(selected);
  if (a) { a.updatedAt = d.updatedAt; a.mirrored = d.total; }
  if (selected !== sel || !tail) return;
  const following = win.to >= win.total;
  win.total = d.total;
  if (following && d.entries && d.from === win.to) { renderPage(tail, d.entries, d.from); win.to = d.total; }
  else if (following) loadNewer(); // missed a page (e.g. before /watch applied): fetch it
  renderHead(); renderPanel();
  const s = $('#scroll');
  if (follow && win.to >= win.total) s.scrollTop = s.scrollHeight; else $('#jump').style.display = 'block';
  updatePin();
});
es.addEventListener('reset', (ev) => { const d = JSON.parse(ev.data); if (key(d.host, d.path) === sel) open(sel); });
es.addEventListener('live', (ev) => { const d = JSON.parse(ev.data); live.set(key(d.host, d.pane), d.text); const a = agentOf(sel); if (a?.host === d.host && a?.pane === d.pane) renderPanel(); });
es.addEventListener('link', (ev) => {
  const link = JSON.parse(ev.data), h = hostOf(link.host);
  if (h) h.link = link;
  const el = $('#link'), n = hosts.filter((h) => h.link.state === 'live').length;
  el.className = 'chip ' + (n === hosts.length ? 'live' : 'down');
  el.textContent = `${n}/${hosts.length} live`;
  renderSide(); renderTeamLine(); renderHead(); updateSend();
});
if (preference('idePanel')) setPanel(true);
setInterval(renderSide, 15000);
</script>
