id = "rarebit-status"
name = "Rarebit Status"
version = "0.4.0"
min_herdr_version = "0.7.5"
description = "Exact-Session Rarebit status and two-tab evidence deck"
platforms = ["linux", "macos"]

[[startup]]
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/startup.mjs"]

[[actions]]
id = "open"
title = "Rarebit Status: open deck"
contexts = ["global", "workspace", "tab", "pane"]
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/open.mjs"]

[[actions]]
id = "refresh-current"
title = "Rarebit Status: refresh current pane"
contexts = ["pane"]
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/action.mjs", "refresh-current"]

[[actions]]
id = "refresh-all"
title = "Rarebit Status: refresh all exact Session bindings"
contexts = ["global", "workspace", "tab", "pane"]
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/action.mjs", "refresh-all"]

[[actions]]
id = "clear-current"
title = "Rarebit Status: clear current pane"
contexts = ["pane"]
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/action.mjs", "clear-current"]

[[actions]]
id = "show-notification"
title = "Rarebit Status: show current notification"
contexts = ["pane"]
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/action.mjs", "show-notification"]

[[events]]
on = "pane.agent_detected"
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/event.mjs"]

[[events]]
on = "pane.agent_status_changed"
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/event.mjs"]

[[events]]
on = "pane.closed"
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/event.mjs"]

[[panes]]
id = "rarebit-deck"
title = "Rarebit Status: Summary + timeline"
placement = "popup"
width = "90%"
height = "88%"
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/rarebit-dashboard.mjs"]
