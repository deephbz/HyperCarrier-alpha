id = "pi-teams-hierarchy"
name = "Pi Teams Hierarchy"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Exact-Membership Team and Worker labels for Herdr Agents"
platforms = ["linux", "macos"]

[[startup]]
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/startup.mjs"]

[[actions]]
id = "refresh-all"
title = "Pi Teams hierarchy: refresh all exact Memberships"
contexts = ["global", "workspace", "tab", "pane"]
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/action.mjs", "refresh-all"]

[[actions]]
id = "clear-all"
title = "Pi Teams hierarchy: clear all projected labels"
contexts = ["global", "workspace", "tab", "pane"]
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/action.mjs", "clear-all"]

[[events]]
on = "pane.agent_detected"
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/event.mjs"]

[[events]]
on = "pane.closed"
command = ["/bin/sh", "../herdr-node/launch.sh", "scripts/event.mjs"]
