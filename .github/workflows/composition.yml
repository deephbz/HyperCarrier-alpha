name: Native composition and app checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Linux WebKit is not an AmPi target; the webkit job runs the WebKit cases.
    env:
      AMPI_TEST_ENGINES: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The runner's cached Node 22 can be older than AmPi's floor; take the newest patch.
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:composition -- --debug
      - run: npm run verify:colorstack -- --debug
      - run: npm run test:composition
      - run: npm --workspace @hypercarrier/ampi test
      - run: npm --workspace @hypercarrier/trace-viewer test
      - run: npm run build:ampi
      - run: npm run build:trace-viewer

  webkit:
    # AmPi.app renders in macOS WebKit, so its browser cases run on macOS.
    runs-on: macos-latest
    # macos-latest has 3 cores; the default pool of 8 overloads it.
    env:
      AMPI_TEST_ENGINES: webkit
      AMPI_TEST_CONCURRENCY: 3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The runner's cached Node 22 can be older than AmPi's floor; take the newest patch.
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install webkit
      - run: npm --workspace @hypercarrier/ampi test
