name: Native composition and app checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Linux WebKit is not an AmPi target; the webkit job runs the WebKit cases.
    env:
      AMPI_TEST_ENGINES: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The runner's cached Node 22 can be older than AmPi's floor; take the newest patch.
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:composition -- --debug
      - run: npm run verify:colorstack -- --debug
      - run: npm run test:composition
      - run: npm --workspace @hypercarrier/ampi test
      - run: npm --workspace @hypercarrier/trace-viewer test
      - run: npm run build:ampi
      - run: npm run build:trace-viewer

  # AmPi.app renders in macOS WebKit, so the WebKit cases run on macOS. Only the
  # files with engine cases run here; the verify job runs the rest. The
  # selection, shards and pool match the webkit job of HyperCarrier's own CI
  # (scripts/test/public-workflow-closure.test.mjs).
  webkit:
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    env:
      AMPI_TEST_ENGINES: webkit
      # macos-latest has 3 cores; a pool of 3 files overloaded it, and reader-place waits timed out.
      AMPI_TEST_CONCURRENCY: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The runner's cached Node 22 can be older than AmPi's floor; take the newest patch.
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install webkit
      - run: npm --workspace @hypercarrier/ampi test -- --engine-cases --shard=${{ matrix.shard }}
