name: Rarebit composition

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-rarebit-composition.mjs --debug
      - run: npm run verify:rarebit
      - run: npm run test:composition
      - run: npm run test:release
      - run: npm run test:timeline
